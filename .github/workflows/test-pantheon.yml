name: Test

# Mirrors jazz-nextjs's test workflow, minus Playwright (this site has no E2E suite yet):
#   local  - lint, typecheck, unit tests and a production build on the runner. Needs no
#            Pantheon environment.
#   deployed - waits for the PR / dev environment, then checks it answers 200.
# Either failing fails the run.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PANTHEON_SITE_NAME: paris-site

permissions:
  contents: read

jobs:
  local:
    name: Test (no Pantheon)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # One failing check must not hide the others; the run goes red at the final gate.
      - name: Lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Unit tests
        id: unit-tests
        continue-on-error: true
        run: pnpm test
        env:
          CI: true

      # Placeholders: the build only needs the variables to exist. Published content is
      # fetched at request time, so no real token belongs in CI.
      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build
        env:
          NEXT_PUBLIC_CSS_SITE_ID: 00000000-0000-0000-0000-000000000000
          CSS_API_KEY: ci-placeholder

      - name: Build Storybook
        id: storybook
        continue-on-error: true
        run: pnpm build-storybook

      - name: Report status
        if: always()
        run: |
          {
            echo "### Local test results (no Pantheon environment)"
            echo ""
            echo "- **Lint:** ${{ steps.lint.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"
            echo "- **Typecheck:** ${{ steps.typecheck.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"
            echo "- **Unit tests:** ${{ steps.unit-tests.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"
            echo "- **Build:** ${{ steps.build.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"
            echo "- **Storybook build:** ${{ steps.storybook.outcome == 'success' && '✅ Passed' || '❌ Failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if any checks failed
        if: steps.lint.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.unit-tests.outcome != 'success' || steps.build.outcome != 'success' || steps.storybook.outcome != 'success'
        run: exit 1

  deployed:
    name: Test deployed site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_NUM=${{ github.event.pull_request.number }}
            ENV_NAME="pr-${PR_NUM}"
          else
            ENV_NAME="dev"
          fi
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "base_url=https://${ENV_NAME}-${PANTHEON_SITE_NAME}.pantheonsite.io" >> "$GITHUB_OUTPUT"

      # Pantheon's Cloudflare-backed GCDN answers unverified automation with a managed
      # challenge (HTTP 403). A per-site bot-bypass token exempts it; it rotates, so fetch it
      # fresh each run rather than storing it. Passed through a masked step output, not
      # GITHUB_ENV, so later third-party actions never see it.
      - name: Fetch Pantheon bot-bypass token
        id: bypass
        continue-on-error: true
        env:
          PANTHEON_MACHINE_TOKEN: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
        run: |
          if [ -z "$PANTHEON_MACHINE_TOKEN" ]; then
            echo "::error::PANTHEON_MACHINE_TOKEN is empty. It must exist as an Actions secret AND a Dependabot secret."
            exit 1
          fi

          curl -fsSL "https://github.com/pantheon-systems/terminus/releases/download/4.3.3/terminus.phar" -o terminus
          chmod +x terminus
          sudo mv terminus /usr/local/bin/terminus
          # Pinned: the plugin runs in the same process as the Pantheon credential.
          terminus self:plugin:install pantheon-systems/terminus-gcdn-plugin:0.4.0
          terminus auth:login --machine-token="$PANTHEON_MACHINE_TOKEN"

          # stderr dropped: terminus prints [notice] lines there that would corrupt the JSON.
          TOKEN=$(terminus gcdn:bot-bypass "$PANTHEON_SITE_NAME" --format=json --fields=role,token 2>/dev/null \
            | jq -r '.[] | select(.role == "current") | .token') || true

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not read the current bot-bypass token for $PANTHEON_SITE_NAME."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Wait for Pantheon build and deployment to complete
        id: wait
        uses: jazzsequence/pantheon-wait-for-build@v2
        with:
          pantheon-machine-token: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
          site-name: ${{ env.PANTHEON_SITE_NAME }}

      - name: Verify Pantheon site is accessible
        env:
          BOT_BYPASS_TOKEN: ${{ steps.bypass.outputs.token }}
        run: |
          if [ -z "$BOT_BYPASS_TOKEN" ]; then
            echo "::error::No bot-bypass token; the 'Fetch Pantheon bot-bypass token' step failed (see its log)."
            exit 1
          fi

          for attempt in $(seq 1 12); do
            echo "Attempt $attempt of 12..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "x-pantheon-bot-bypass: ${BOT_BYPASS_TOKEN}" "${{ steps.env.outputs.base_url }}" || echo "000")
            if [ "$HTTP_CODE" == "200" ]; then
              echo "✅ Site is accessible (HTTP $HTTP_CODE)"
              exit 0
            fi
            echo "⏳ Site returned HTTP $HTTP_CODE, waiting..."
            sleep 5
          done

          echo "❌ Site not accessible after 60 seconds"
          exit 1
